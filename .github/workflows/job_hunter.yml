name: 🔭 Planetarium Job Hunter

on:
  schedule:
    # بيشتغل كل 6 ساعات (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # بيسمحلك تشغله يدوياً من GitHub UI
  repository_dispatch:
    # بيسمح بتشغيله من التيليجرام أو أي Webhook خارجي فوراً
    types: [telegram_search, search]

jobs:
  hunt-jobs:
    name: Hunt Planetarium Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 📂 Restore database from cache
        uses: actions/cache@v4
        with:
          path: data/jobs_seen.db
          key: jobs-db-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            jobs-db-${{ runner.os }}-

      - name: 🔧 Create directories
        run: |
          mkdir -p data
          mkdir -p cv

      - name: 📄 Restore CV from secret
        env:
          CV_BASE64: ${{ secrets.CV_BASE64 }}
        run: |
          echo "$CV_BASE64" | base64 -d > cv/CV.pdf
          echo "✅ CV restored successfully"

      - name: 🚀 Run Job Hunter
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUR_NAME:          ${{ secrets.YOUR_NAME }}
          YOUR_PHONE:         ${{ secrets.YOUR_PHONE }}
        run: python main.py

      - name: 💾 Save database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/jobs_seen.db
          key: jobs-db-${{ runner.os }}-${{ github.run_number }}

      - name: 📋 Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-logs-${{ github.run_number }}
          path: data/bot.log
          retention-days: 7
